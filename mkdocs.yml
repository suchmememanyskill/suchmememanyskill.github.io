site_name: Such Meme, Many Skill's Dumping Ground
theme:
    logo: img/favicon.ico
    favicon: img/favicon.ico
    name: material
    features:
        - toc.integrate
        - navigation.instant
        - navigation.sections
        - navigation.tracking
    custom_dir: overrides

    palette:
    # Palette toggle for light mode
    - scheme: default
      primary: grey
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: grey
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    icon:
        repo: fontawesome/brands/github
        logo: fontawesome/solid/wrench

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - toc:
      permalink: true
      toc_depth: 3

nav:
    - Home: index.md
    - Guides:
        - 'Old':
            - 'Switch Theming Guide (external site)': 'https://switch.hacks.guide/homebrew/nxtheme-installer.html'
            - 'Switch Nand Restore Guide': 'guides/nandrestore.md'
            - 'Installing AutoRCM': 'guides/autorcm.md'
            - 'Switch Hackable Serial List': 'guides/switchserials.md'
            - 'Emummc manual Guide': 'guides/emunand.md'
            - 'Emummc manual linux Guide': 'guides/emunand_linux.md'
            - 'Old Unbrick Guide': 'guides/unbrick_old.md'
        - 'Switch Dump & Installing Guide': 'guides/switchdumpguide.md'
        - 'SysMMC save extract': 'guides/switchextractsaves.md'
        - 'Switch Unbrick Guide': 'guides/unbrick.md'
        
    - Apps:
        - 'Old':
            - 'Switch Theme Bat Script': 'apps/themebatscript.md'
            - 'CubeAdventure - Game by me': 'apps/CubeAdventure.md'
        - 'Payload Launcher': 'apps/payload.md'
        - 'TegraExplorer': 'apps/TegraExplorer.md'
        - 'EmmcHaccGen': 'apps/emmchaccgen.md'
    - Themes:
        - 'General Theme Sites': 'Themes/General_Theme_Sites.md'
        - 'My 3ds Themes': 'Themes/3ds_Themes.md'
        - 'My Switch Themes': 'Themes/Switch_Themes.md'
    - Blog: blog/index.md
    - About: about.md
    
site_url: https://suchmememanyskill.github.io/

extra_css:
    - css/custom.css

extra_javascript:
    - js/redirect.js
